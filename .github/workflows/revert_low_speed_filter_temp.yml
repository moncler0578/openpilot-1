name: One-shot revert low-speed filter

on:
  push:
    branches: [g_hud]
    paths:
      - '.github/workflows/revert_low_speed_filter_temp.yml'

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: g_hud
      - name: Revert low-speed steering filter only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Apply only the inverse diff of the original low-speed filter commit
          # onto the current branch, preserving later unrelated edits.
          git revert 9e4a00e85a463f12ee13e75f59df2a4fa436baea --no-commit

          # Remove the matching UI/config entry added later to apilot.json.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('selfdrive/apilot.json')
          s = p.read_text(encoding='utf-8')
          block = '''  {
   "group": "횡방향",
   "name": "LatLowSpeedCurvTauMs",
   "title": "LOW SPEED CURV FILTER (ms)",
   "descr": "2 m/s(7.2 km/h) 이하에서 저속 곡률 보정용 목표 곡률을 부드럽게 하는 시간상수입니다(4 m/s 까지 점감). 앞차 뒤 출발 시 핸들이 좌우로 잘게 흔들리면 올리세요(300~500). 0: 사용 안 함. 기본값: 300.",
   "min": 0,
   "max": 1000,
   "default": 300,
   "unit": 50
  },
'''
          if s.count(block) != 1:
              raise SystemExit(f'expected exactly one LatLowSpeedCurvTauMs block, found {s.count(block)}')
          p.write_text(s.replace(block, ''), encoding='utf-8')
          PY

          # Remove this temporary workflow from the final tree.
          git rm .github/workflows/revert_low_speed_filter_temp.yml
          git add -A
          git commit -m "Revert low-speed curvature steering filter"
          git push origin HEAD:g_hud
