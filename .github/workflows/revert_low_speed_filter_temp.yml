name: One-shot revert low-speed filter

on:
  push:
    branches: [g_hud]
    paths:
      - '.github/workflows/revert_low_speed_filter_temp.yml'

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: g_hud
      - name: Revert low-speed steering filter only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git revert 9e4a00e85a463f12ee13e75f59df2a4fa436baea --no-commit

          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('selfdrive/apilot.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          before = len(data['params'])
          data['params'] = [x for x in data['params'] if x.get('name') != 'LatLowSpeedCurvTauMs']
          if len(data['params']) != before - 1:
              raise SystemExit('LatLowSpeedCurvTauMs entry count was not exactly one')
          p.write_text(json.dumps(data, ensure_ascii=False, indent=1) + '\n', encoding='utf-8')
          PY

          git rm .github/workflows/revert_low_speed_filter_temp.yml
          git add -A
          git commit -m "Revert low-speed curvature steering filter"
          git push origin HEAD:g_hud
